# Dependabot keeps the pinned workflow actions current once this repository has
# workflows. Updates are grouped and weekly to limit noise; minor and patch
# updates merge automatically through native auto-merge, majors wait for review.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 14
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      github-actions-major:
        patterns: ["*"]
        update-types: ["major"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(actions)"
